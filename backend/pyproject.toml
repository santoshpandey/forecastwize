[project]
name = "forecastwize-backend"
version = "0.1.0"
description = "ForecastWize FastAPI adapter plus deterministic baseline forecasting."
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"../evaluation/metrics.py" = ["E402"]
"../evaluation/run_baseline.py" = ["E402"]
"../evaluation/run_agent.py" = ["E402"]
"../evaluation/compare.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", ".."]
addopts = ["-q"]
markers = [
    "api: FastAPI TestClient HTTP adapter tests",
]
