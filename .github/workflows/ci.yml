name: CI

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"
  # Ordinary CI must not call a vendor LLM. Leave unset (do not add repository secrets).
  OPENAI_API_KEY: ""

jobs:
  python-lint:
    name: Python lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install Ruff (from pinned requirements)
        run: python -m pip install --upgrade pip && python -m pip install "ruff==0.12.10"
      - name: Show toolchain
        run: |
          python --version
          python -m ruff --version
      - name: Ruff check (backend)
        run: python -m ruff check backend
      - name: Ruff format (backend)
        run: python -m ruff format --check backend
      - name: Ruff check (evaluation, scripts)
        run: python -m ruff check --config backend/pyproject.toml evaluation scripts
      - name: Ruff format (evaluation, scripts)
        run: python -m ruff format --check --config backend/pyproject.toml evaluation scripts

  python-tests:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend pins
        run: python -m pip install --upgrade pip && python -m pip install -r backend/requirements.txt
      - name: Show toolchain
        run: |
          python --version
          python -c "from importlib import metadata as m; print('pandas', m.version('pandas')); print('numpy', m.version('numpy')); print('statsmodels', m.version('statsmodels'))"
      - name: Pytest (exclude API adapter tests)
        working-directory: backend
        run: >
          python -m pytest
          -o addopts="-v --tb=short --strict-markers"
          -m "not api"
          --junitxml=junit-python.xml
      - name: Upload pytest JUnit (python)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-python-tests
          path: backend/junit-python.xml
          if-no-files-found: warn

  api-tests:
    name: API tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend pins
        run: python -m pip install --upgrade pip && python -m pip install -r backend/requirements.txt
      - name: Show toolchain
        run: python --version
      - name: Pytest (FastAPI TestClient, marker api)
        working-directory: backend
        run: >
          python -m pytest
          -o addopts="-v --tb=short --strict-markers"
          -m api
          --junitxml=junit-api.xml
      - name: Upload pytest JUnit (api)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-api-tests
          path: backend/junit-api.xml
          if-no-files-found: warn

  typescript-typecheck:
    name: TypeScript typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend pins (npm ci)
        working-directory: frontend
        run: npm ci
      - name: Show toolchain
        run: node -v && npm -v
      - name: tsc --noEmit
        working-directory: frontend
        run: npm run typecheck

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend pins (npm ci)
        working-directory: frontend
        run: npm ci
      - name: Show toolchain
        run: node -v && npm -v
      - name: next build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
        run: npm run build

  ci-ok:
    name: CI
    runs-on: ubuntu-latest
    needs:
      - python-lint
      - python-tests
      - api-tests
      - typescript-typecheck
      - frontend-build
    if: always()
    steps:
      - name: Report job results
        run: |
          echo "python-lint=${{ needs.python-lint.result }}"
          echo "python-tests=${{ needs.python-tests.result }}"
          echo "api-tests=${{ needs.api-tests.result }}"
          echo "typescript-typecheck=${{ needs.typescript-typecheck.result }}"
          echo "frontend-build=${{ needs.frontend-build.result }}"
      - name: Fail if any required job failed
        if: >-
          needs.python-lint.result != 'success' ||
          needs.python-tests.result != 'success' ||
          needs.api-tests.result != 'success' ||
          needs.typescript-typecheck.result != 'success' ||
          needs.frontend-build.result != 'success'
        run: |
          echo "::error::One or more CI jobs failed. Open the failed job log above (lint, pytest JUnit artifacts, tsc, or next build)."
          exit 1
